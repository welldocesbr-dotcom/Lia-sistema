/* ---------- Persistência: Firebase (nuvem) com fallback para localStorage ----------
   Se você preencher window.FIREBASE_CONFIG (no <head> do HTML) com as chaves do
   seu projeto Firebase, os dados passam a salvar no Firestore — sincronizados
   entre qualquer computador/celular que acessar o sistema, mesmo saindo e
   entrando de novo. Sem preencher, continua funcionando 100% no navegador local. */
async function load(key, fallback) {
  if (window.__firebaseDB) {
    try {
      const snap = await window.__firebaseDB.collection("lia-sistema").doc(key).get();
      return snap.exists ? snap.data().value : fallback;
    } catch (e) { console.error("Firestore (load) falhou, usando localStorage:", e); }
  }
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
async function save(key, value) {
  if (window.__firebaseDB) {
    try {
      await window.__firebaseDB.collection("lia-sistema").doc(key).set({ value });
      return;
    } catch (e) { console.error("Firestore (save) falhou, usando localStorage:", e); }
  }
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
}

/* ---------------- Editor de imagem (zoom / recorte) ---------------- */

function ImageCropper({ file, viewportW = 280, viewportH = 280, outW = 480, outH = 480, round = false, title = "Ajustar imagem", onConfirm, onCancel }) {
  const [imgSrc, setImgSrc] = useState(null);
  const [natural, setNatural] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const dragRef = useRef(null);

  useEffect(() => {
    const reader = new FileReader();
    reader.onload = () => setImgSrc(reader.result);
    reader.readAsDataURL(file);
  }, [file]);

  const baseScale = natural ? Math.max(viewportW / natural.w, viewportH / natural.h) : 1;
  const scale = baseScale * zoom;
  const dispW = natural ? natural.w * scale : 0;
  const dispH = natural ? natural.h * scale : 0;

  const clamp = (ox, oy, dw, dh) => {
    const maxX = Math.max(0, (dw - viewportW) / 2);
    const maxY = Math.max(0, (dh - viewportH) / 2);
    return { x: Math.min(maxX, Math.max(-maxX, ox)), y: Math.min(maxY, Math.max(-maxY, oy)) };
  };

  const onImgLoad = (e) => {
    setNatural({ w: e.target.naturalWidth, h: e.target.naturalHeight });
    setZoom(1); setOffset({ x: 0, y: 0 });
  };

  const startDrag = (x, y) => { dragRef.current = { startX: x, startY: y, offX: offset.x, offY: offset.y }; };
  const moveDrag = (x, y) => {
    if (!dragRef.current) return;
    const dx = x - dragRef.current.startX, dy = y - dragRef.current.startY;
    setOffset(clamp(dragRef.current.offX + dx, dragRef.current.offY + dy, dispW, dispH));
  };
  const endDrag = () => { dragRef.current = null; };

  const onZoom = (z) => {
    setZoom(z);
    if (natural) setOffset((o) => clamp(o.x, o.y, natural.w * baseScale * z, natural.h * baseScale * z));
  };

  const confirm = () => {
    if (!natural) return;
    const cropX = (dispW - viewportW) / 2 - offset.x;
    const cropY = (dispH - viewportH) / 2 - offset.y;
    const sx = Math.max(0, Math.min(natural.w, cropX / scale));
    const sy = Math.max(0, Math.min(natural.h, cropY / scale));
    const sw = Math.max(1, Math.min(natural.w - sx, viewportW / scale));
    const sh = Math.max(1, Math.min(natural.h - sy, viewportH / scale));
    const canvas = document.createElement("canvas");
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext("2d");
    const img = new window.Image();
    img.onload = () => {
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
      onConfirm(canvas.toDataURL("image/jpeg", 0.9));
    };
    img.src = imgSrc;
  };

  return (
    <Modal title={title} onClose={onCancel}>
      <div className="flex flex-col items-center gap-4">
        <div
          className="relative overflow-hidden bg-[var(--cream-2)]"
          style={{ width: viewportW, height: viewportH, borderRadius: round ? "9999px" : "16px", touchAction: "none", cursor: "grab", userSelect: "none" }}
          onMouseDown={(e) => startDrag(e.clientX, e.clientY)}
          onMouseMove={(e) => moveDrag(e.clientX, e.clientY)}
          onMouseUp={endDrag}
          onMouseLeave={endDrag}
          onTouchStart={(e) => startDrag(e.touches[0].clientX, e.touches[0].clientY)}
          onTouchMove={(e) => moveDrag(e.touches[0].clientX, e.touches[0].clientY)}
          onTouchEnd={endDrag}
        >
          {imgSrc && (
            <img
              src={imgSrc}
              onLoad={onImgLoad}
              draggable={false}
              alt=""
              style={{
                position: "absolute", left: "50%", top: "50%", maxWidth: "none",
                width: dispW || "auto", height: dispH || "auto",
                transform: `translate(calc(-50% + ${offset.x}px), calc(-50% + ${offset.y}px))`,
              }}
            />
          )}
          {!natural && <div className="flex h-full items-center justify-center text-xs text-[var(--muted)]">Carregando...</div>}
        </div>
        <div className="flex w-full items-center gap-3">
          <span className="text-xs text-[var(--muted)]">−</span>
          <input type="range" min="1" max="3" step="0.01" value={zoom} onChange={(e) => onZoom(Number(e.target.value))} className="w-full accent-[var(--clay)]" />
          <span className="text-xs text-[var(--muted)]">+</span>
        </div>
        <p className="text-center text-xs text-[var(--muted)]">Arraste a imagem para posicionar e use o controle deslizante para dar zoom.</p>
        <div className="flex w-full gap-2">
          <Btn variant="soft" className="flex-1" onClick={onCancel}>Cancelar</Btn>
          <Btn className="flex-1" onClick={confirm} disabled={!natural}><Icon name="Check" size={16} /> Usar imagem</Btn>
        </div>
      </div>
    </Modal>
  );
}

function Dashboard({ clients, services, inventory, sales, expenses }) {
  const now = new Date();
  const [month, setMonth] = useState(now.getMonth()); // 0-11
  const [year, setYear] = useState(now.getFullYear());
  const isCurrentMonth = month === now.getMonth() && year === now.getFullYear();

  const ym = `${year}-${String(month + 1).padStart(2, "0")}`;
  const salesMonth = sales.filter((s) => s.date.startsWith(ym));
  const expensesMonth = expenses.filter((e) => e.date.startsWith(ym));

  const totalMonth = salesMonth.reduce((a, s) => a + s.total, 0);
  const netMonth = salesMonth.reduce((a, s) => a + s.netReceived, 0);
  const totalExpenses = expensesMonth.reduce((a, e) => a + Number(e.amount), 0);
  const profit = netMonth - totalExpenses;
  const ticket = salesMonth.length ? totalMonth / salesMonth.length : 0;
  const lowStock = inventory.filter((i) => Number(i.qty) <= Number(i.min));

  const cards = [
    { label: "Faturamento do mês", value: money(totalMonth), icon: "TrendingUp" },
    { label: "Despesas do mês", value: money(totalExpenses), icon: "TrendingDown" },
    { label: "Lucro do mês", value: money(profit), icon: "Wallet" },
    { label: "Vendas no mês", value: salesMonth.length, icon: "ShoppingCart" },
    { label: "Ticket médio", value: money(ticket), icon: "Percent" },
  ];

  const years = Array.from({ length: 5 }, (_, i) => now.getFullYear() - 2 + i);

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="font-display text-2xl font-semibold text-[var(--ink)]">Bem-vinda de volta ✨</h2>
          <p className="text-sm text-[var(--muted)]">{isCurrentMonth ? "Resumo do mês atual" : "Resumo do mês selecionado"}</p>
        </div>
        <div className="flex gap-2">
          <select value={month} onChange={(e) => setMonth(Number(e.target.value))} className="rounded-xl border border-[var(--border)] bg-white px-3 py-2 text-sm font-semibold text-[var(--ink-soft)] outline-none focus:border-[var(--clay)]">
            {MONTH_NAMES.map((m, i) => <option key={m} value={i}>{m}</option>)}
          </select>
          <select value={year} onChange={(e) => setYear(Number(e.target.value))} className="rounded-xl border border-[var(--border)] bg-white px-3 py-2 text-sm font-semibold text-[var(--ink-soft)] outline-none focus:border-[var(--clay)]">
            {years.map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-4 lg:grid-cols-5">
        {cards.map((c) => (
          <div key={c.label} className="rounded-2xl border border-[var(--border-soft)] bg-white p-5 shadow-sm">
            <div className="mb-3 flex h-9 w-9 items-center justify-center rounded-xl bg-[var(--cream-2)] text-[var(--clay)]"><Icon name={c.icon} size={18} /></div>
            <p className="font-display text-xl font-semibold text-[var(--ink)]">{c.value}</p>
            <p className="text-xs text-[var(--muted)]">{c.label}</p>
          </div>
        ))}
      </div>
      <div className="grid gap-4 lg:grid-cols-2">
        <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-5">
          <h3 className="mb-3 font-display text-base font-semibold text-[var(--ink)]">Cadastros</h3>
          <div className="space-y-2 text-sm text-[var(--ink-soft)]">
            <div className="flex justify-between"><span>Clientes</span><b>{clients.length}</b></div>
            <div className="flex justify-between"><span>Serviços</span><b>{services.length}</b></div>
            <div className="flex justify-between"><span>Itens em estoque</span><b>{inventory.length}</b></div>
          </div>
        </div>
        <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-5">
          <h3 className="mb-3 flex items-center gap-2 font-display text-base font-semibold text-[var(--ink)]">
            <Icon name="AlertTriangle" size={16} className="text-[var(--danger)]" /> Estoque baixo
          </h3>
          {lowStock.length === 0 ? (
            <p className="text-sm text-[var(--muted)]">Tudo certo por aqui.</p>
          ) : (
            <div className="space-y-2">
              {lowStock.slice(0, 5).map((i) => (
                <div key={i.id} className="flex justify-between text-sm">
                  <span className="text-[var(--ink-soft)]">{i.name}</span>
                  <span className="font-semibold text-[var(--danger)]">{i.qty} un.</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Agenda (agendamentos) ---------------- */

const APPT_STATUS = {
  agendado: { label: "Agendado", cls: "bg-[var(--cream-2)] text-[var(--clay)]" },
  concluido: { label: "Concluído", cls: "bg-[var(--success-soft)] text-[var(--success)]" },
  cancelado: { label: "Cancelado", cls: "bg-[var(--danger-soft)] text-[var(--danger)]" },
};

function Agenda({ appointments, setAppointments, clients, setClients, services }) {
  const [modal, setModal] = useState(null);
  const [dayFilter, setDayFilter] = useState(today());
  const [showAll, setShowAll] = useState(false);
  const [newClientModal, setNewClientModal] = useState(false);
  const [newClientForm, setNewClientForm] = useState(CLIENT_EMPTY);

  const empty = { clientId: "", serviceId: "", date: today(), time: "09:00", status: "agendado", notes: "" };
  const [form, setForm] = useState(empty);

  const openNew = (presetDate) => { setForm({ ...empty, date: presetDate || dayFilter }); setModal("edit"); };

  const submit = (e) => {
    e.preventDefault();
    const client = clients.find((c) => c.id === form.clientId);
    const service = services.find((s) => s.id === form.serviceId);
    const data = { ...form, clientName: client?.name || "Cliente avulso", serviceName: service?.name || "" };
    if (form.id) setAppointments(appointments.map((a) => (a.id === form.id ? data : a)));
    else setAppointments([{ ...data, id: uid(), createdAt: today() }, ...appointments]);
    setModal(null);
  };

  const setStatus = (id, status) => setAppointments(appointments.map((a) => (a.id === id ? { ...a, status } : a)));
  const remove = (id) => setAppointments(appointments.filter((a) => a.id !== id));

  const saveNewClient = (e) => {
    e.preventDefault();
    const c = { ...newClientForm, id: uid(), createdAt: today() };
    setClients([c, ...clients]);
    setForm({ ...form, clientId: c.id });
    setNewClientModal(false);
    setNewClientForm(CLIENT_EMPTY);
  };

  const list = (showAll ? appointments : appointments.filter((a) => a.date === dayFilter))
    .slice()
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="font-display text-2xl font-semibold text-[var(--ink)]">Agenda</h2>
        <Btn onClick={() => openNew()}><Icon name="CalendarPlus" size={16} /> Novo agendamento</Btn>
      </div>

      <div className="flex flex-wrap items-center gap-3">
        <Input type="date" value={dayFilter} onChange={(e) => { setDayFilter(e.target.value); setShowAll(false); }} className="w-auto" />
        <button onClick={() => { setDayFilter(today()); setShowAll(false); }} className="rounded-xl bg-[var(--cream-2)] px-3.5 py-2 text-xs font-semibold text-[var(--clay-dark)]">Hoje</button>
        <button onClick={() => setShowAll(!showAll)} className={`rounded-xl px-3.5 py-2 text-xs font-semibold ${showAll ? "bg-[var(--clay)] text-white" : "bg-[var(--cream-2)] text-[var(--clay-dark)]"}`}>Ver todos os dias</button>
      </div>

      {list.length === 0 ? (
        <Empty icon="Calendar" text="Nenhum agendamento para esta data." />
      ) : (
        <div className="space-y-2">
          {list.map((a) => (
            <div key={a.id} className="flex flex-wrap items-center gap-3 rounded-2xl border border-[var(--border-soft)] bg-white p-4">
              <div className="flex min-w-[70px] flex-col items-center rounded-xl bg-[var(--cream)] px-3 py-2">
                <span className="font-display text-base font-semibold text-[var(--clay)]">{a.time}</span>
                {showAll && <span className="text-[10px] text-[var(--muted-2)]">{new Date(a.date + "T00:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "short" })}</span>}
              </div>
              <div className="min-w-0 flex-1">
                <p className="truncate font-medium text-[var(--ink)]">{a.clientName || "Cliente avulso"}</p>
                <p className="truncate text-xs text-[var(--muted)]">{a.serviceName || "Sem serviço definido"}{a.notes ? ` · ${a.notes}` : ""}</p>
              </div>
              <span className={`rounded-full px-2.5 py-1 text-xs font-semibold ${APPT_STATUS[a.status].cls}`}>{APPT_STATUS[a.status].label}</span>
              <div className="flex gap-1">
                {a.status !== "concluido" && <button onClick={() => setStatus(a.id, "concluido")} title="Marcar como concluído" className="rounded-lg p-2 text-[var(--success)] hover:bg-[var(--success-soft)]"><Icon name="Check" size={15} /></button>}
                {a.status !== "cancelado" && <button onClick={() => setStatus(a.id, "cancelado")} title="Cancelar" className="rounded-lg p-2 text-[var(--danger)] hover:bg-[var(--danger-soft)]"><Icon name="X" size={15} /></button>}
                <button onClick={() => { setForm(a); setModal("edit"); }} className="rounded-lg p-2 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Pencil" size={14} /></button>
                <button onClick={() => remove(a.id)} className="rounded-lg p-2 text-[var(--danger)] hover:bg-[var(--danger-soft)]"><Icon name="Trash2" size={14} /></button>
              </div>
            </div>
          ))}
        </div>
      )}

      {modal === "edit" && (
        <Modal title={form.id ? "Editar agendamento" : "Novo agendamento"} onClose={() => setModal(null)}>
          <form onSubmit={submit} className="space-y-4">
            <Field label="Cliente">
              <div className="flex gap-2">
                <select required value={form.clientId} onChange={(e) => setForm({ ...form, clientId: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                  <option value="">Selecionar cliente</option>
                  {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <button type="button" onClick={() => setNewClientModal(true)} title="Cadastrar novo cliente" className="flex shrink-0 items-center justify-center rounded-lg bg-[var(--cream-2)] px-3 text-[var(--clay)] hover:bg-[var(--cream-3)]"><Icon name="UserPlus" size={16} /></button>
              </div>
            </Field>
            <Field label="Serviço">
              <select value={form.serviceId} onChange={(e) => setForm({ ...form, serviceId: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                <option value="">Selecionar serviço</option>
                {services.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Data"><Input type="date" required value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
              <Field label="Horário"><Input type="time" required value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} /></Field>
            </div>
            <Field label="Status">
              <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                {Object.entries(APPT_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </Field>
            <Field label="Observações"><Input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Opcional" /></Field>
            <Btn type="submit" className="w-full"><Icon name="Save" size={16} /> Salvar agendamento</Btn>
          </form>
        </Modal>
      )}

      {newClientModal && (
        <Modal title="Novo cliente" onClose={() => setNewClientModal(false)} wide>
          <form onSubmit={saveNewClient} className="space-y-4">
            <ClientFormFields form={newClientForm} setForm={setNewClientForm} compact />
            <Btn type="submit" className="w-full"><Icon name="Save" size={16} /> Salvar e selecionar</Btn>
          </form>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Inventory ---------------- */

const INV_CATEGORIES = ["Consumível (uso interno)", "Produto para revenda", "Equipamento", "Outro"];

function InventoryPage({ inventory, setInventory }) {
  const [modal, setModal] = useState(null);
  const [filter, setFilter] = useState("Todos");
  const empty = { name: "", category: "Consumível (uso interno)", unit: "un", qty: "", min: "5", cost: "", price: "", sellable: false };
  const [form, setForm] = useState(empty);

  const openNew = () => { setForm(empty); setModal("edit"); };
  const submit = (e) => {
    e.preventDefault();
    const data = { ...form, qty: Number(form.qty) || 0, min: Number(form.min) || 0, cost: Number(form.cost) || 0, price: Number(form.price) || 0 };
    if (form.id) setInventory(inventory.map((i) => (i.id === form.id ? data : i)));
    else setInventory([{ ...data, id: uid() }, ...inventory]);
    setModal(null);
  };
  const remove = (id) => setInventory(inventory.filter((i) => i.id !== id));

  const filtered = filter === "Todos" ? inventory : inventory.filter((i) => i.category === filter);
  const totalCostValue = inventory.reduce((a, i) => a + Number(i.qty) * Number(i.cost), 0);
  const totalSaleValue = inventory.reduce((a, i) => a + Number(i.qty) * Number(i.price), 0);

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="font-display text-2xl font-semibold text-[var(--ink)]">Estoque</h2>
        <Btn onClick={openNew}><Icon name="Plus" size={16} /> Novo item</Btn>
      </div>

      <div className="grid gap-4 sm:grid-cols-2">
        <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-5">
          <p className="text-xs font-semibold uppercase tracking-wide text-[var(--muted)]">Valor total em estoque (custo)</p>
          <p className="mt-1 font-display text-2xl font-semibold text-[var(--ink)]">{money(totalCostValue)}</p>
          <p className="mt-1 text-xs text-[var(--muted-2)]">Soma de quantidade × custo de todos os itens cadastrados.</p>
        </div>
        <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-5">
          <p className="text-xs font-semibold uppercase tracking-wide text-[var(--muted)]">Valor potencial de venda</p>
          <p className="mt-1 font-display text-2xl font-semibold text-[var(--clay)]">{money(totalSaleValue)}</p>
          <p className="mt-1 text-xs text-[var(--muted-2)]">Soma de quantidade × preço de venda de todos os itens.</p>
        </div>
      </div>

      <p className="text-sm text-[var(--muted)]">Aqui entra tudo que é usado no atendimento — consumíveis (luvas, algodão, géis) e produtos vendidos ao cliente. Marque "vender no PDV" para o item aparecer na Frente de Caixa.</p>

      <div className="flex flex-wrap gap-2">
        {["Todos", ...INV_CATEGORIES].map((c) => (
          <button key={c} onClick={() => setFilter(c)} className={`rounded-xl px-3.5 py-1.5 text-xs font-semibold ${filter === c ? "bg-[var(--clay)] text-white" : "bg-[var(--cream-2)] text-[var(--clay-dark)]"}`}>{c}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Empty icon="Package" text="Cadastre produtos e consumíveis para controlar o estoque." />
      ) : (
        <div className="overflow-x-auto rounded-2xl border border-[var(--border-soft)] bg-white">
          <table className="w-full text-sm">
            <thead className="bg-[var(--cream)] text-left text-xs uppercase tracking-wide text-[var(--muted)]">
              <tr><th className="px-5 py-3">Item</th><th className="px-5 py-3">Categoria</th><th className="px-5 py-3">Qtd.</th><th className="px-5 py-3">Custo</th><th className="px-5 py-3">Venda</th><th className="px-5 py-3">PDV</th><th className="px-5 py-3"></th></tr>
            </thead>
            <tbody>
              {filtered.map((i) => (
                <tr key={i.id} className="border-t border-[var(--border-soft)] hover:bg-[var(--cream)]/60">
                  <td className="px-5 py-3 font-medium text-[var(--ink)]">{i.name}</td>
                  <td className="px-5 py-3 text-xs text-[var(--muted)]">{i.category}</td>
                  <td className="px-5 py-3">
                    <span className={`rounded-full px-2 py-0.5 text-xs font-semibold ${i.qty <= i.min ? "bg-[var(--danger-soft)] text-[var(--danger)]" : "bg-[var(--success-soft)] text-[var(--success)]"}`}>{i.qty} {i.unit}</span>
                  </td>
                  <td className="px-5 py-3 text-[var(--ink-soft)]">{money(i.cost)}</td>
                  <td className="px-5 py-3 text-[var(--ink-soft)]">{money(i.price)}</td>
                  <td className="px-5 py-3">{i.sellable ? <span className="rounded-full bg-[var(--cream-2)] px-2 py-0.5 text-xs font-semibold text-[var(--clay)]">Sim</span> : <span className="text-xs text-[var(--muted-2)]">Não</span>}</td>
                  <td className="px-5 py-3">
                    <div className="flex justify-end gap-1">
                      <button onClick={() => { setForm(i); setModal("edit"); }} className="rounded-lg p-2 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Pencil" size={14} /></button>
                      <button onClick={() => remove(i.id)} className="rounded-lg p-2 text-[var(--danger)] hover:bg-[var(--danger-soft)]"><Icon name="Trash2" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {modal === "edit" && (
        <Modal title={form.id ? "Editar item" : "Novo item"} onClose={() => setModal(null)}>
          <form onSubmit={submit} className="space-y-4">
            <Field label="Nome do item"><Input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Ex: Gel condutor, Esmalte, Luva descartável..." /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Categoria">
                <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                  {INV_CATEGORIES.map((c) => <option key={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Unidade">
                <select value={form.unit} onChange={(e) => setForm({ ...form, unit: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                  {["un", "ml", "g", "kg", "caixa", "par"].map((u) => <option key={u}>{u}</option>)}
                </select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Quantidade"><Input type="number" value={form.qty} onChange={(e) => setForm({ ...form, qty: e.target.value })} /></Field>
              <Field label="Estoque mínimo"><Input type="number" value={form.min} onChange={(e) => setForm({ ...form, min: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Custo (R$)"><Input type="number" step="0.01" value={form.cost} onChange={(e) => setForm({ ...form, cost: e.target.value })} /></Field>
              <Field label="Preço de venda (R$)"><Input type="number" step="0.01" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} /></Field>
            </div>
            <label className="flex items-center gap-2 text-sm text-[var(--ink-soft)]">
              <input type="checkbox" checked={form.sellable} onChange={(e) => setForm({ ...form, sellable: e.target.checked })} />
              Vender no PDV (aparece na aba Produtos da Frente de Caixa)
            </label>
            <Btn type="submit" className="w-full"><Icon name="Save" size={16} /> Salvar item</Btn>
          </form>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- POS / Frente de Caixa ---------------- */

function POS({ services, inventory, setInventory, clients, setClients, sales, setSales, settings }) {
  const [cart, setCart] = useState([]);
  const [tab, setTab] = useState("servicos");
  const [payment, setPayment] = useState("dinheiro");
  const [clientId, setClientId] = useState("");
  const [passFee, setPassFee] = useState(settings.passFeeToClient);
  const [done, setDone] = useState(null);
  const [catalogQ, setCatalogQ] = useState("");
  const [newClientModal, setNewClientModal] = useState(false);
  const [newClientForm, setNewClientForm] = useState(CLIENT_EMPTY);

  const addItem = (item, type) => {
    setCart((c) => {
      const found = c.find((i) => i.refId === item.id && i.type === type);
      if (found) return c.map((i) => (i === found ? { ...i, qty: i.qty + 1 } : i));
      return [...c, { id: uid(), refId: item.id, type, name: item.name, price: item.price, qty: 1 }];
    });
  };
  const changeQty = (id, delta) => setCart((c) => c.map((i) => (i.id === id ? { ...i, qty: Math.max(1, i.qty + delta) } : i)).filter((i) => i.qty > 0));
  const removeItem = (id) => setCart((c) => c.filter((i) => i.id !== id));

  const subtotal = cart.reduce((a, i) => a + i.price * i.qty, 0);
  const feeRate = payment === "debito" ? settings.fees.debito : payment === "creditoVista" ? settings.fees.creditoVista : payment === "creditoParcelado" ? settings.fees.creditoParcelado : payment === "pix" ? settings.fees.pix : 0;
  const feeAmount = subtotal * (feeRate / 100);
  const total = passFee ? subtotal + feeAmount : subtotal;
  const netReceived = passFee ? subtotal : subtotal - feeAmount;

  const finalize = () => {
    if (cart.length === 0) return;
    const sale = {
      id: uid(), date: today(), time: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
      clientId, clientName: clients.find((c) => c.id === clientId)?.name || "Cliente avulso",
      items: cart, subtotal, payment, feeRate, feeAmount, passFee, total, netReceived,
    };
    setSales([sale, ...sales]);
    setInventory(inventory.map((i) => {
      const used = cart.find((c) => c.type === "produto" && c.refId === i.id);
      return used ? { ...i, qty: Math.max(0, i.qty - used.qty) } : i;
    }));
    setDone(sale);
    setCart([]); setClientId(""); setPayment("dinheiro");
  };

  const saveNewClient = (e) => {
    e.preventDefault();
    const c = { ...newClientForm, id: uid(), createdAt: today() };
    setClients([c, ...clients]);
    setClientId(c.id);
    setNewClientModal(false);
    setNewClientForm(CLIENT_EMPTY);
  };

  const paymentOpts = [
    { key: "dinheiro", label: "Dinheiro", icon: "Banknote" },
    { key: "pix", label: "Pix", icon: "QrCode" },
    { key: "debito", label: "Débito", icon: "CreditCard" },
    { key: "creditoVista", label: "Crédito à vista", icon: "CreditCard" },
    { key: "creditoParcelado", label: "Crédito parcelado", icon: "CreditCard" },
  ];

  const sellableProducts = inventory.filter((i) => i.sellable);
  const allCatalog = [
    ...services.map((s) => ({ ...s, kind: "servico" })),
    ...sellableProducts.map((p) => ({ ...p, kind: "produto" })),
  ];
  const suggestions = catalogQ.trim()
    ? allCatalog.filter((i) => i.name.toLowerCase().includes(catalogQ.trim().toLowerCase())).slice(0, 8)
    : [];
  const browseList = (tab === "servicos" ? services : sellableProducts);

  const pickSuggestion = (item) => {
    addItem(item, item.kind);
    setCatalogQ("");
  };

  return (
    <div className="grid gap-5 lg:grid-cols-[1.3fr_1fr]">
      <div>
        <h2 className="mb-1 font-display text-2xl font-semibold text-[var(--ink)]">Frente de Caixa</h2>
        <p className="mb-4 text-xs text-[var(--muted)]">Itens vindos do catálogo de Serviços e dos produtos marcados como "vender no PDV" no Estoque.</p>

        <div className="relative mb-4">
          <Icon name="Search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--muted-2)]" />
          <Input
            placeholder="Digite para buscar serviço ou produto, ex: Esfoliação"
            value={catalogQ}
            onChange={(e) => setCatalogQ(e.target.value)}
            className="pl-9"
            autoComplete="off"
          />
          {suggestions.length > 0 && (
            <div className="absolute z-20 mt-1 w-full overflow-hidden rounded-xl border border-[var(--border)] bg-white shadow-lg">
              {suggestions.map((item) => (
                <button
                  key={item.kind + item.id}
                  onClick={() => pickSuggestion(item)}
                  className="flex w-full items-center justify-between gap-3 border-b border-[var(--border-soft)] px-4 py-2.5 text-left last:border-0 hover:bg-[var(--cream)]"
                >
                  <span className="flex min-w-0 items-center gap-2">
                    {item.image && <img src={item.image} className="h-6 w-6 shrink-0 rounded object-cover" />}
                    <span className={`shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase ${item.kind === "servico" ? "bg-[var(--cream-2)] text-[var(--clay)]" : "bg-[var(--success-soft)] text-[var(--success)]"}`}>
                      {item.kind === "servico" ? "Serviço" : "Produto"}
                    </span>
                    <span className="truncate text-sm font-medium text-[var(--ink)]">{item.name}</span>
                  </span>
                  <span className="shrink-0 text-sm font-semibold text-[var(--clay)]">{money(item.price)}</span>
                </button>
              ))}
            </div>
          )}
          {catalogQ.trim() && suggestions.length === 0 && (
            <div className="absolute z-20 mt-1 w-full rounded-xl border border-[var(--border)] bg-white p-4 text-sm text-[var(--muted)] shadow-lg">
              Nada encontrado no catálogo para "{catalogQ}".
            </div>
          )}
        </div>

        <div className="mb-3 flex gap-2">
          <button onClick={() => setTab("servicos")} className={`rounded-xl px-4 py-2 text-sm font-semibold ${tab === "servicos" ? "bg-[var(--clay)] text-white" : "bg-[var(--cream-2)] text-[var(--clay-dark)]"}`}>Serviços</button>
          <button onClick={() => setTab("produtos")} className={`rounded-xl px-4 py-2 text-sm font-semibold ${tab === "produtos" ? "bg-[var(--clay)] text-white" : "bg-[var(--cream-2)] text-[var(--clay-dark)]"}`}>Produtos</button>
        </div>
        <div className="grid max-h-[50vh] grid-cols-1 gap-2 overflow-y-auto sm:grid-cols-2">
          {browseList.map((item) => (
            <button key={item.id} onClick={() => addItem(item, tab === "servicos" ? "servico" : "produto")}
              className="flex items-center justify-between rounded-xl border border-[var(--border-soft)] bg-white px-4 py-3 text-left hover:border-[var(--clay)] hover:bg-[var(--cream)] active:scale-[0.98]">
              <span className="flex min-w-0 items-center gap-2">
                {item.image && <img src={item.image} className="h-8 w-8 shrink-0 rounded-lg object-cover" />}
                <span className="truncate text-sm font-medium text-[var(--ink)]">{item.name}</span>
              </span>
              <span className="shrink-0 text-sm font-semibold text-[var(--clay)]">{money(item.price)}</span>
            </button>
          ))}
          {browseList.length === 0 && (
            <p className="col-span-2 text-sm text-[var(--muted)]">
              {tab === "servicos" ? "Nenhum serviço cadastrado no catálogo ainda." : "Nenhum produto marcado como \"vender no PDV\" no Estoque."}
            </p>
          )}
        </div>
      </div>

      <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-5">
        <h3 className="mb-3 font-display text-base font-semibold text-[var(--ink)]">Carrinho</h3>
        <Field label="Cliente">
          <div className="flex gap-2">
            <select value={clientId} onChange={(e) => setClientId(e.target.value)} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
              <option value="">Cliente avulso</option>
              {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <button type="button" onClick={() => setNewClientModal(true)} title="Cadastrar novo cliente" className="flex shrink-0 items-center gap-1.5 rounded-lg bg-[var(--cream-2)] px-3 text-sm font-semibold text-[var(--clay)] hover:bg-[var(--cream-3)]">
              <Icon name="UserPlus" size={16} /> Novo
            </button>
          </div>
        </Field>

        <div className="my-4 max-h-40 space-y-2 overflow-y-auto">
          {cart.length === 0 && <p className="text-sm text-[var(--muted)]">Adicione serviços ou produtos.</p>}
          {cart.map((i) => (
            <div key={i.id} className="flex items-center justify-between gap-2 text-sm">
              <span className="flex-1 text-[var(--ink)]">{i.name}</span>
              <div className="flex items-center gap-1">
                <button onClick={() => changeQty(i.id, -1)} className="rounded p-1 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Minus" size={12} /></button>
                <span className="w-5 text-center">{i.qty}</span>
                <button onClick={() => changeQty(i.id, 1)} className="rounded p-1 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Plus" size={12} /></button>
              </div>
              <span className="w-16 text-right font-medium text-[var(--ink)]">{money(i.price * i.qty)}</span>
              <button onClick={() => removeItem(i.id)} className="text-[var(--danger)]"><Icon name="X" size={14} /></button>
            </div>
          ))}
        </div>

        <Field label="Forma de pagamento">
          <div className="grid grid-cols-2 gap-2">
            {paymentOpts.map((p) => (
              <button key={p.key} onClick={() => setPayment(p.key)}
                className={`flex items-center gap-2 rounded-lg border px-3 py-2 text-xs font-semibold ${payment === p.key ? "border-[var(--clay)] bg-[var(--cream)] text-[var(--clay)]" : "border-[var(--border)] text-[var(--ink-soft)]"}`}>
                <Icon name={p.icon} size={14} /> {p.label}
              </button>
            ))}
          </div>
        </Field>

        {feeRate > 0 && (
          <label className="mt-3 flex items-center gap-2 text-xs text-[var(--ink-soft)]">
            <input type="checkbox" checked={passFee} onChange={(e) => setPassFee(e.target.checked)} />
            Repassar taxa da maquininha ({feeRate}%) ao cliente
          </label>
        )}

        <div className="mt-4 space-y-1.5 border-t border-[var(--border-soft)] pt-4 text-sm">
          <div className="flex justify-between text-[var(--ink-soft)]"><span>Subtotal</span><span>{money(subtotal)}</span></div>
          {feeRate > 0 && <div className="flex justify-between text-[var(--danger)]"><span>Taxa da maquininha ({feeRate}%)</span><span>{money(feeAmount)}</span></div>}
          <div className="flex justify-between text-base font-bold text-[var(--ink)]"><span>Total cobrado</span><span>{money(total)}</span></div>
          <div className="flex justify-between text-xs text-[var(--muted)]"><span>Valor líquido recebido</span><span>{money(netReceived)}</span></div>
        </div>

        <Btn className="mt-4 w-full" onClick={finalize} disabled={cart.length === 0}>
          <Icon name="ShoppingCart" size={16} /> Finalizar venda
        </Btn>
      </div>

      {newClientModal && (
        <Modal title="Novo cliente" onClose={() => setNewClientModal(false)} wide>
          <form onSubmit={saveNewClient} className="space-y-4">
            <ClientFormFields form={newClientForm} setForm={setNewClientForm} compact />
            <p className="text-xs text-[var(--muted-2)]">Você pode completar o restante do cadastro depois, na aba Clientes.</p>
            <Btn type="submit" className="w-full"><Icon name="Save" size={16} /> Salvar e selecionar</Btn>
          </form>
        </Modal>
      )}

      {done && (
        <Modal title="Venda concluída" onClose={() => setDone(null)}>
          <div className="text-center">
            <div className="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-[var(--success-soft)] text-[var(--success)]"><Icon name="Check" size={26} /></div>
            <p className="font-display text-xl font-semibold text-[var(--ink)]">{money(done.total)}</p>
            <p className="text-sm text-[var(--muted)]">{done.clientName} · {paymentOpts.find(p => p.key === done.payment)?.label}</p>
            <Btn className="mt-5 w-full" onClick={() => setDone(null)}>Nova venda</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

const PAYMENT_LABELS = { dinheiro: "Dinheiro", pix: "Pix", debito: "Débito", creditoVista: "Crédito à vista", creditoParcelado: "Crédito parcelado" };

function SaleEditor({ sale, services, inventory, clients, settings, onCancel, onSave }) {
  const [form, setForm] = useState(sale);

  const changeQty = (id, delta) => setForm((f) => ({
    ...f,
    items: f.items.map((i) => (i.id === id ? { ...i, qty: Math.max(1, i.qty + delta) } : i)).filter((i) => i.qty > 0),
  }));
  const removeItem = (id) => setForm((f) => ({ ...f, items: f.items.filter((i) => i.id !== id) }));
  const addItem = (item, type) => setForm((f) => {
    const found = f.items.find((i) => i.refId === item.id && i.type === type);
    const items = found
      ? f.items.map((i) => (i === found ? { ...i, qty: i.qty + 1 } : i))
      : [...f.items, { id: uid(), refId: item.id, type, name: item.name, price: item.price, qty: 1 }];
    return { ...f, items };
  });

  const subtotal = form.items.reduce((a, i) => a + i.price * i.qty, 0);
  const feeRate = form.payment === "debito" ? settings.fees.debito : form.payment === "creditoVista" ? settings.fees.creditoVista : form.payment === "creditoParcelado" ? settings.fees.creditoParcelado : form.payment === "pix" ? settings.fees.pix : 0;
  const feeAmount = subtotal * (feeRate / 100);
  const total = form.passFee ? subtotal + feeAmount : subtotal;
  const netReceived = form.passFee ? subtotal : subtotal - feeAmount;

  const save = () => {
    const client = clients.find((c) => c.id === form.clientId);
    onSave({ ...form, subtotal, feeRate, feeAmount, total, netReceived, clientName: client?.name || form.clientName || "Cliente avulso" });
  };

  const sellableProducts = inventory.filter((i) => i.sellable);

  return (
    <Modal title="Editar venda" onClose={onCancel} wide>
      <div className="space-y-4">
        <Field label="Cliente">
          <select value={form.clientId || ""} onChange={(e) => setForm({ ...form, clientId: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
            <option value="">Cliente avulso</option>
            {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </Field>

        <div>
          <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-[var(--muted)]">Itens da venda</p>
          <div className="max-h-40 space-y-2 overflow-y-auto rounded-xl border border-[var(--border-soft)] p-3">
            {form.items.map((i) => (
              <div key={i.id} className="flex items-center justify-between gap-2 text-sm">
                <span className="flex-1 text-[var(--ink)]">{i.name}</span>
                <div className="flex items-center gap-1">
                  <button onClick={() => changeQty(i.id, -1)} className="rounded p-1 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Minus" size={12} /></button>
                  <span className="w-5 text-center">{i.qty}</span>
                  <button onClick={() => changeQty(i.id, 1)} className="rounded p-1 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Plus" size={12} /></button>
                </div>
                <span className="w-16 text-right font-medium text-[var(--ink)]">{money(i.price * i.qty)}</span>
                <button onClick={() => removeItem(i.id)} className="text-[var(--danger)]"><Icon name="X" size={14} /></button>
              </div>
            ))}
            {form.items.length === 0 && <p className="text-sm text-[var(--muted)]">Nenhum item. Adicione abaixo.</p>}
          </div>
          <div className="mt-2 flex flex-wrap gap-1.5">
            {services.slice(0, 6).map((s) => (
              <button key={s.id} onClick={() => addItem(s, "servico")} className="rounded-full bg-[var(--cream-2)] px-3 py-1 text-xs font-medium text-[var(--clay-dark)] hover:bg-[var(--cream-3)]">+ {s.name}</button>
            ))}
            {sellableProducts.slice(0, 4).map((p) => (
              <button key={p.id} onClick={() => addItem(p, "produto")} className="rounded-full bg-[var(--success-soft)] px-3 py-1 text-xs font-medium text-[var(--success)] hover:opacity-80">+ {p.name}</button>
            ))}
          </div>
        </div>

        <Field label="Forma de pagamento">
          <select value={form.payment} onChange={(e) => setForm({ ...form, payment: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
            {Object.entries(PAYMENT_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
          </select>
        </Field>

        {feeRate > 0 && (
          <label className="flex items-center gap-2 text-xs text-[var(--ink-soft)]">
            <input type="checkbox" checked={form.passFee} onChange={(e) => setForm({ ...form, passFee: e.target.checked })} />
            Repassar taxa da maquininha ({feeRate}%) ao cliente
          </label>
        )}

        <div className="space-y-1.5 border-t border-[var(--border-soft)] pt-4 text-sm">
          <div className="flex justify-between text-[var(--ink-soft)]"><span>Subtotal</span><span>{money(subtotal)}</span></div>
          {feeRate > 0 && <div className="flex justify-between text-[var(--danger)]"><span>Taxa da maquininha</span><span>{money(feeAmount)}</span></div>}
          <div className="flex justify-between text-base font-bold text-[var(--ink)]"><span>Total</span><span>{money(total)}</span></div>
        </div>

        <Btn className="w-full" onClick={save}><Icon name="Save" size={16} /> Salvar alterações</Btn>
      </div>
    </Modal>
  );
}

function SalesPage({ sales, setSales, inventory, setInventory, services, clients, settings }) {
  const [editing, setEditing] = useState(null);
  const [q, setQ] = useState("");
  const [dayFilter, setDayFilter] = useState("");

  const filtered = sales
    .filter((s) => (dayFilter ? s.date === dayFilter : true))
    .filter((s) => (s.clientName || "").toLowerCase().includes(q.toLowerCase()));

  const restockFromSale = (sale, inv) => inv.map((i) => {
    const used = sale.items.find((c) => c.type === "produto" && c.refId === i.id);
    return used ? { ...i, qty: Number(i.qty) + Number(used.qty) } : i;
  });
  const deductForSale = (sale, inv) => inv.map((i) => {
    const used = sale.items.find((c) => c.type === "produto" && c.refId === i.id);
    return used ? { ...i, qty: Math.max(0, Number(i.qty) - Number(used.qty)) } : i;
  });

  const remove = (sale) => {
    setInventory(restockFromSale(sale, inventory));
    setSales(sales.filter((s) => s.id !== sale.id));
  };

  const saveEdit = (updated) => {
    let inv = restockFromSale(editing, inventory); // devolve as quantidades da venda antiga
    inv = deductForSale(updated, inv); // aplica as quantidades da venda nova
    setInventory(inv);
    setSales(sales.map((s) => (s.id === updated.id ? updated : s)));
    setEditing(null);
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="font-display text-2xl font-semibold text-[var(--ink)]">Vendas</h2>
      </div>
      <div className="flex flex-wrap gap-3">
        <div className="relative max-w-xs flex-1">
          <Icon name="Search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--muted-2)]" />
          <Input placeholder="Buscar por cliente" value={q} onChange={(e) => setQ(e.target.value)} className="pl-9" />
        </div>
        <Input type="date" value={dayFilter} onChange={(e) => setDayFilter(e.target.value)} className="w-auto" />
        {dayFilter && <button onClick={() => setDayFilter("")} className="rounded-xl bg-[var(--cream-2)] px-3.5 py-2 text-xs font-semibold text-[var(--clay-dark)]">Limpar data</button>}
      </div>

      {filtered.length === 0 ? (
        <Empty icon="Receipt" text="Nenhuma venda encontrada." />
      ) : (
        <div className="overflow-x-auto rounded-2xl border border-[var(--border-soft)] bg-white">
          <table className="w-full text-sm">
            <thead className="bg-[var(--cream)] text-left text-xs uppercase tracking-wide text-[var(--muted)]">
              <tr><th className="px-5 py-3">Data</th><th className="px-5 py-3">Cliente</th><th className="px-5 py-3">Itens</th><th className="px-5 py-3">Pagamento</th><th className="px-5 py-3">Total</th><th className="px-5 py-3"></th></tr>
            </thead>
            <tbody>
              {filtered.map((s) => (
                <tr key={s.id} className="border-t border-[var(--border-soft)] hover:bg-[var(--cream)]/60">
                  <td className="px-5 py-3 text-[var(--ink-soft)]">{new Date(s.date + "T00:00:00").toLocaleDateString("pt-BR")} {s.time}</td>
                  <td className="px-5 py-3 font-medium text-[var(--ink)]">{s.clientName}</td>
                  <td className="px-5 py-3 text-xs text-[var(--muted)]">{s.items.map((i) => `${i.qty}x ${i.name}`).join(", ")}</td>
                  <td className="px-5 py-3 text-[var(--ink-soft)]">{PAYMENT_LABELS[s.payment] || s.payment}</td>
                  <td className="px-5 py-3 font-semibold text-[var(--clay)]">{money(s.total)}</td>
                  <td className="px-5 py-3">
                    <div className="flex justify-end gap-1">
                      <button onClick={() => setEditing(s)} className="rounded-lg p-2 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Pencil" size={14} /></button>
                      <button onClick={() => remove(s)} className="rounded-lg p-2 text-[var(--danger)] hover:bg-[var(--danger-soft)]"><Icon name="Trash2" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {editing && (
        <SaleEditor sale={editing} services={services} inventory={inventory} clients={clients} settings={settings} onCancel={() => setEditing(null)} onSave={saveEdit} />
      )}
    </div>
  );
}

const EXPENSE_CATEGORIES = ["Aluguel", "Contas (água/luz/internet)", "Produtos/Insumos", "Marketing", "Salários/Comissões", "Manutenção", "Impostos", "Outros"];

function ExpensesPage({ expenses, setExpenses }) {
  const [modal, setModal] = useState(null);
  const now = new Date();
  const [month, setMonth] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const empty = { date: today(), description: "", category: "Produtos/Insumos", amount: "", notes: "" };
  const [form, setForm] = useState(empty);

  const ym = `${year}-${String(month + 1).padStart(2, "0")}`;
  const filtered = expenses.filter((e) => e.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date));
  const total = filtered.reduce((a, e) => a + Number(e.amount), 0);
  const years = Array.from({ length: 5 }, (_, i) => now.getFullYear() - 2 + i);

  const openNew = () => { setForm(empty); setModal("edit"); };
  const submit = (e) => {
    e.preventDefault();
    const data = { ...form, amount: Number(form.amount) || 0 };
    if (form.id) setExpenses(expenses.map((x) => (x.id === form.id ? data : x)));
    else setExpenses([{ ...data, id: uid() }, ...expenses]);
    setModal(null);
  };
  const remove = (id) => setExpenses(expenses.filter((e) => e.id !== id));

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="font-display text-2xl font-semibold text-[var(--ink)]">Despesas</h2>
        <Btn onClick={openNew}><Icon name="Plus" size={16} /> Nova despesa</Btn>
      </div>

      <div className="flex flex-wrap items-center gap-2">
        <select value={month} onChange={(e) => setMonth(Number(e.target.value))} className="rounded-xl border border-[var(--border)] bg-white px-3 py-2 text-sm font-semibold text-[var(--ink-soft)] outline-none focus:border-[var(--clay)]">
          {MONTH_NAMES.map((m, i) => <option key={m} value={i}>{m}</option>)}
        </select>
        <select value={year} onChange={(e) => setYear(Number(e.target.value))} className="rounded-xl border border-[var(--border)] bg-white px-3 py-2 text-sm font-semibold text-[var(--ink-soft)] outline-none focus:border-[var(--clay)]">
          {years.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
      </div>

      <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-5">
        <p className="text-xs font-semibold uppercase tracking-wide text-[var(--muted)]">Total gasto em {MONTH_NAMES[month]}/{year}</p>
        <p className="mt-1 font-display text-2xl font-semibold text-[var(--danger)]">{money(total)}</p>
      </div>

      {filtered.length === 0 ? (
        <Empty icon="TrendingDown" text="Nenhuma despesa lançada neste mês." />
      ) : (
        <div className="overflow-hidden rounded-2xl border border-[var(--border-soft)] bg-white">
          <table className="w-full text-sm">
            <thead className="bg-[var(--cream)] text-left text-xs uppercase tracking-wide text-[var(--muted)]">
              <tr><th className="px-5 py-3">Data</th><th className="px-5 py-3">Descrição</th><th className="px-5 py-3">Categoria</th><th className="px-5 py-3">Valor</th><th className="px-5 py-3"></th></tr>
            </thead>
            <tbody>
              {filtered.map((e) => (
                <tr key={e.id} className="border-t border-[var(--border-soft)] hover:bg-[var(--cream)]/60">
                  <td className="px-5 py-3 text-[var(--ink-soft)]">{new Date(e.date + "T00:00:00").toLocaleDateString("pt-BR")}</td>
                  <td className="px-5 py-3 font-medium text-[var(--ink)]">{e.description}</td>
                  <td className="px-5 py-3 text-xs text-[var(--muted)]">{e.category}</td>
                  <td className="px-5 py-3 font-semibold text-[var(--danger)]">{money(e.amount)}</td>
                  <td className="px-5 py-3">
                    <div className="flex justify-end gap-1">
                      <button onClick={() => { setForm(e); setModal("edit"); }} className="rounded-lg p-2 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Pencil" size={14} /></button>
                      <button onClick={() => remove(e.id)} className="rounded-lg p-2 text-[var(--danger)] hover:bg-[var(--danger-soft)]"><Icon name="Trash2" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {modal === "edit" && (
        <Modal title={form.id ? "Editar despesa" : "Nova despesa"} onClose={() => setModal(null)}>
          <form onSubmit={submit} className="space-y-4">
            <Field label="Descrição"><Input required value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Data"><Input type="date" required value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
              <Field label="Valor (R$)"><Input type="number" step="0.01" required value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} /></Field>
            </div>
            <Field label="Categoria">
              <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                {EXPENSE_CATEGORIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Observações"><Input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="Opcional" /></Field>
            <Btn type="submit" className="w-full"><Icon name="Save" size={16} /> Salvar despesa</Btn>
          </form>
        </Modal>
      )}
    </div>
  );
}

        <div className="max-w-3xl space-y-5">
          <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-6">
            <div className="mb-4 flex items-center justify-between">
              <h3 className="flex items-center gap-2 font-display text-base font-semibold text-[var(--ink)]"><Icon name="Palette" size={17} /> Fontes</h3>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Fonte dos títulos">
                <select value={local.theme?.fontDisplay || DEFAULT_THEME.fontDisplay} onChange={(e) => persist({ ...local, theme: { ...(local.theme || DEFAULT_THEME), fontDisplay: e.target.value } })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                  {FONT_OPTIONS_DISPLAY.map((f) => <option key={f} value={f}>{f}</option>)}
                </select>
              </Field>
              <Field label="Fonte do texto">
                <select value={local.theme?.fontBody || DEFAULT_THEME.fontBody} onChange={(e) => persist({ ...local, theme: { ...(local.theme || DEFAULT_THEME), fontBody: e.target.value } })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm outline-none focus:border-[var(--clay)]">
                  {FONT_OPTIONS_BODY.map((f) => <option key={f} value={f}>{f}</option>)}
                </select>
              </Field>
            </div>
          </div>

          <div className="rounded-2xl border border-[var(--border-soft)] bg-white p-6">
            <div className="mb-4 flex items-center justify-between">
              <h3 className="flex items-center gap-2 font-display text-base font-semibold text-[var(--ink)]"><Icon name="Palette" size={17} /> Cores do sistema</h3>
              <button onClick={resetTheme} className="flex items-center gap-1.5 rounded-lg bg-[var(--cream-2)] px-3 py-1.5 text-xs font-semibold text-[var(--clay-dark)] hover:bg-[var(--cream-3)]">
                <Icon name="RotateCcw" size={13} /> Restaurar padrão
              </button>
            </div>
            <div className="space-y-5">
              {THEME_LABELS.map((group) => (
                <div key={group.group}>
                  <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-[var(--muted)]">{group.group}</p>
                  <div className="grid grid-cols-2 gap-3 sm:grid-cols-3">
                    {group.keys.map(([key, label]) => (
                      <label key={key} className="flex items-center gap-2 rounded-lg border border-[var(--border)] px-2.5 py-2">
                        <input type="color" value={(local.theme?.colors || DEFAULT_THEME.colors)[key]} onChange={(e) => setColor(key, e.target.value)} className="h-7 w-7 shrink-0 cursor-pointer rounded border-0 bg-transparent" />
                        <span className="truncate text-xs text-[var(--ink-soft)]">{label}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {tab === "usuarios" && (
        <div className="space-y-4">
          <Btn onClick={() => { setUserForm(emptyUser); setUserModal(true); }}><Icon name="UserPlus" size={16} /> Novo usuário</Btn>
          <div className="overflow-hidden rounded-2xl border border-[var(--border-soft)] bg-white">
            <table className="w-full text-sm">
              <thead className="bg-[var(--cream)] text-left text-xs uppercase tracking-wide text-[var(--muted)]">
                <tr><th className="px-5 py-3">Nome</th><th className="px-5 py-3">Usuário</th><th className="px-5 py-3">Função</th><th className="px-5 py-3"></th></tr>
              </thead>
              <tbody>
                {local.users.map((u) => (
                  <tr key={u.id} className="border-t border-[var(--border-soft)]">
                    <td className="px-5 py-3 font-medium text-[var(--ink)]">{u.name}</td>
                    <td className="px-5 py-3 text-[var(--ink-soft)]">{u.username}</td>
                    <td className="px-5 py-3 capitalize text-[var(--ink-soft)]">{u.role}</td>
                    <td className="px-5 py-3">
                      <div className="flex justify-end gap-1">
                        <button onClick={() => { setUserForm(u); setUserModal(true); }} className="rounded-lg p-2 text-[var(--muted)] hover:bg-[var(--cream-2)]"><Icon name="Pencil" size={14} /></button>
                        {u.id !== currentUser.id && <button onClick={() => removeUser(u.id)} className="rounded-lg p-2 text-[var(--danger)] hover:bg-[var(--danger-soft)]"><Icon name="Trash2" size={14} /></button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {userModal && (
        <Modal title={userForm.id ? "Editar usuário" : "Novo usuário"} onClose={() => setUserModal(null)}>
          <form onSubmit={saveUser} className="space-y-4">
            <Field label="Nome"><Input required value={userForm.name} onChange={(e) => setUserForm({ ...userForm, name: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Usuário (login)"><Input required value={userForm.username} onChange={(e) => setUserForm({ ...userForm, username: e.target.value })} /></Field>
              <Field label="Senha"><Input required value={userForm.password} onChange={(e) => setUserForm({ ...userForm, password: e.target.value })} /></Field>
            </div>
            <Field label="Função">
              <select value={userForm.role} onChange={(e) => setUserForm({ ...userForm, role: e.target.value })} className="w-full rounded-lg border border-[var(--border)] bg-white px-3 py-2.5 text-sm">
                {["admin", "gerente", "atendente", "caixa"].map((r) => <option key={r}>{r}</option>)}
              </select>
            </Field>
            <Field label="Permissões de acesso">
              <div className="grid grid-cols-2 gap-2">
                {MODULES.map((m) => (
                  <label key={m.key} className="flex items-center gap-2 text-sm text-[var(--ink-soft)]">
                    <input type="checkbox" checked={!!userForm.perms[m.key]} onChange={(e) => setUserForm({ ...userForm, perms: { ...userForm.perms, [m.key]: e.target.checked } })} />
                    {m.label}
                  </label>
                ))}
              </div>
            </Field>
            <Btn type="submit" className="w-full"><Icon name="Save" size={16} /> Salvar usuário</Btn>
          </form>
        </Modal>
      )}

      {logoFile && (
        <ImageCropper
          file={logoFile}
          viewportW={260} viewportH={260} outW={480} outH={480}
          round
          title="Ajustar logomarca"
          onCancel={() => setLogoFile(null)}
          onConfirm={(dataUrl) => { persist({ ...local, logo: dataUrl }); setLogoFile(null); }}
        />
      )}
    </div>
  );
}

/* ---------------- App shell ---------------- */

function App() {
  const [loading, setLoading] = useState(true);
  const [settings, setSettingsState] = useState(DEFAULT_SETTINGS);
  const [clients, setClientsState] = useState([]);
  const [services, setServicesState] = useState([]);
  const [inventory, setInventoryState] = useState([]);
  const [sales, setSalesState] = useState([]);
  const [appointments, setAppointmentsState] = useState([]);
  const [expenses, setExpensesState] = useState([]);
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [navOpen, setNavOpen] = useState(false);

  useEffect(() => {
    (async () => {
      const [s, c, sv, inv, sl, ap, ex] = await Promise.all([
        load("lia:settings", DEFAULT_SETTINGS),
        load("lia:clients", []),
        load("lia:services", []),
        load("lia:inventory", []),
        load("lia:sales", []),
        load("lia:appointments", []),
        load("lia:expenses", []),
      ]);
      setSettingsState({ ...DEFAULT_SETTINGS, ...s, theme: { ...DEFAULT_THEME, ...(s.theme || {}), colors: { ...DEFAULT_THEME.colors, ...(s.theme?.colors || {}) } } });
      setClientsState(c); setServicesState(sv); setInventoryState(inv); setSalesState(sl); setAppointmentsState(ap); setExpensesState(ex);
      setLoading(false);
    })();
  }, []);

  const setSettings = (v) => { setSettingsState(v); save("lia:settings", v); };
  const setClients = (v) => { setClientsState(v); save("lia:clients", v); };
  const setServices = (v) => { setServicesState(v); save("lia:services", v); };
  const setInventory = (v) => { setInventoryState(v); save("lia:inventory", v); };
  const setSales = (v) => { setSalesState(v); save("lia:sales", v); };
  const setAppointments = (v) => { setAppointmentsState(v); save("lia:appointments", v); };
  const setExpenses = (v) => { setExpensesState(v); save("lia:expenses", v); };

  if (loading) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-[var(--cream)]">
        <style>{buildThemeCSS(DEFAULT_THEME)}</style>
        <div className="h-10 w-10 animate-spin rounded-full border-4 border-[var(--border-soft)] border-t-[var(--clay)]" />
      </div>
    );
  }

  if (!user) {
    return (<><style>{buildThemeCSS(settings.theme)}</style><Login settings={settings} onLogin={setUser} /></>);
  }

  const visibleModules = MODULES.filter((m) => user.role === "admin" || user.perms[m.key]);
  const icons = { dashboard: "LayoutDashboard", clientes: "Users", agenda: "Calendar", servicos: "Scissors", estoque: "Package", caixa: "ShoppingCart", vendas: "Receipt", despesas: "TrendingDown", configuracoes: "SettingsIcon" };

  return (
    <div className="min-h-screen bg-[var(--cream)]">
      <style>{buildThemeCSS(settings.theme)}</style>

      <div className="flex min-h-screen">
        {/* Sidebar */}
        <aside className={`fixed inset-y-0 left-0 z-40 w-64 transform bg-white border-r border-[var(--border-soft)] transition-transform lg:static lg:translate-x-0 ${navOpen ? "translate-x-0" : "-translate-x-full"}`}>
          <div className="flex items-center gap-3 border-b border-[var(--border-soft)] px-5 py-5">
            {settings.logo ? <img src={settings.logo} className="h-10 w-10 rounded-full object-cover" /> : <div className="flex h-10 w-10 items-center justify-center rounded-full bg-[var(--clay)] text-white"><Icon name="Scissors" size={18} /></div>}
            <div className="min-w-0">
              <p className="truncate font-display text-sm font-semibold text-[var(--ink)]">{settings.clinicName}</p>
              <p className="text-[11px] text-[var(--muted-2)]">{user.name} · {user.role}</p>
            </div>
          </div>
          <nav className="space-y-1 p-3">
            {visibleModules.map((m) => {
              return (
                <button key={m.key} onClick={() => { setPage(m.key); setNavOpen(false); }}
                  className={`flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium transition-colors ${page === m.key ? "bg-[var(--clay)] text-white" : "text-[var(--ink-soft)] hover:bg-[var(--cream-2)]"}`}>
                  <Icon name={icons[m.key]} size={17} /> {m.label}
                </button>
              );
            })}
          </nav>
          <div className="absolute bottom-0 w-full border-t border-[var(--border-soft)] p-3">
            <button onClick={() => setUser(null)} className="flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium text-[var(--danger)] hover:bg-[var(--danger-soft)]">
              <Icon name="LogOut" size={17} /> Sair
            </button>
          </div>
        </aside>

        {navOpen && <div className="fixed inset-0 z-30 bg-black/30 lg:hidden" onClick={() => setNavOpen(false)} />}

        {/* Main */}
        <main className="flex-1 min-w-0">
          <div className="flex items-center gap-3 border-b border-[var(--border-soft)] bg-white px-5 py-3 lg:hidden">
            <button onClick={() => setNavOpen(true)} className="rounded-lg p-2 text-[var(--clay-dark)] hover:bg-[var(--cream-2)]"><Icon name="ChevronRight" size={18} /></button>
            <p className="font-display text-sm font-semibold text-[var(--ink)]">{settings.clinicName}</p>
          </div>
          <div className="p-5 lg:p-8">
            {page === "dashboard" && <Dashboard clients={clients} services={services} inventory={inventory} sales={sales} expenses={expenses} />}
            {page === "clientes" && <Clients clients={clients} setClients={setClients} />}
            {page === "agenda" && <Agenda appointments={appointments} setAppointments={setAppointments} clients={clients} setClients={setClients} services={services} />}
            {page === "servicos" && <ServicesPage services={services} setServices={setServices} />}
            {page === "estoque" && <InventoryPage inventory={inventory} setInventory={setInventory} />}
            {page === "caixa" && <POS services={services} inventory={inventory} setInventory={setInventory} clients={clients} setClients={setClients} sales={sales} setSales={setSales} settings={settings} />}
            {page === "vendas" && <SalesPage sales={sales} setSales={setSales} inventory={inventory} setInventory={setInventory} services={services} clients={clients} settings={settings} />}
            {page === "despesas" && <ExpensesPage expenses={expenses} setExpenses={setExpenses} />}
            {page === "configuracoes" && <SettingsPage settings={settings} setSettings={setSettings} currentUser={user} />}
          </div>
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
